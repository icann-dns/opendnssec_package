##
## Use as much as we can from the Salsa CI team jobs.
##
include:
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/salsa-ci.yml
  - https://salsa.debian.org/salsa-ci-team/pipeline/raw/master/pipeline-jobs.yml

##
## Disable the puiparts test: we roll our own since we have two
## installation variants (sqlite3 vs mysql).
##
variables:
  SALSA_CI_DISABLE_PIUPARTS: 1

##
## Run piuparts.
##
.piuparts-common: &piuparts-common
  stage: test
  image: registry.salsa.debian.org/salsa-ci-team/images/piuparts
  services:
    - docker:dind
  except:
    - tags

  script:
    # Derive the base distribution name
    - if [ "${PIUPARTS_MODE}" = "upgrade" ]; then DISTRIB="stable"; else DISTRIB="unstable"; fi

    # Build the chroot
    - CHROOT_PATH=/tmp/debian-chroot
    - CONTAINER_ID=$(docker run --rm -d debian:${DISTRIB} sleep infinity)
    - docker exec ${CONTAINER_ID} bash -c "apt-get update && apt-get install eatmydata lsof -y"
    - mkdir -p ${CHROOT_PATH}
    - docker export ${CONTAINER_ID} | tar -C ${CHROOT_PATH} -xf -
    - rm -rf ${CHROOT_PATH}/.zfs

    # Figure out the piuparts command line arguments
    - PIUPARTS_ARGS="--scriptsdir /etc/piuparts/scripts
                     --warn-on-leftovers-after-purge
                     --existing-chroot ${CHROOT_PATH}"
    - VERSION=$(awk -F '(\(([0-9]*:)?)|\)' '{print $2; exit}' < debian/changelog)
    - ARCH=$(dpkg --print-architecture)
    - PACKAGES="${WORKING_DIR}/libhsm-bin_${VERSION}_${ARCH}.deb
                ${WORKING_DIR}/opendnssec-common_${VERSION}_all.deb
                ${WORKING_DIR}/opendnssec-doc_${VERSION}_all.deb
                ${WORKING_DIR}/opendnssec-enforcer-${BACKEND}_${VERSION}_${ARCH}.deb
                ${WORKING_DIR}/opendnssec-enforcer_${VERSION}_all.deb
                ${WORKING_DIR}/opendnssec-signer_${VERSION}_${ARCH}.deb
                ${WORKING_DIR}/opendnssec_${VERSION}_all.deb"

    # Call piuparts, either in install or in upgrade mode
    - if [ "${PIUPARTS_MODE}" = "upgrade" ]; then
          piuparts ${PIUPARTS_ARGS}
                   --distribution stable
                   --extra-repo "deb http://security.debian.org/debian-security stable/updates main"
                   --extra-repo "deb http://deb.debian.org/debian stable-updates main"
                   --distribution unstable
                   ${PACKAGES};
      else
          piuparts ${PIUPARTS_ARGS}
                   --distribution unstable
                   ${PACKAGES};
      fi

# piupart install test using the sqlite3 backend
piuparts-install-sqlite3:
  <<: *piuparts-common
  variables:
    PIUPARTS_MODE: install
    BACKEND: sqlite3

# piupart install test using the mysql backend
piuparts-install-mysql:
  <<: *piuparts-common
  variables:
    PIUPARTS_MODE: install
    BACKEND: mysql

# piupart upgrade test using the sqlite3 backend
piuparts-upgrade-sqlite3:
  <<: *piuparts-common
  variables:
    PIUPARTS_MODE: upgrade
    BACKEND: sqlite3

# piupart upgrade test using the mysql backend
piuparts-upgrade-mysql:
  <<: *piuparts-common
  variables:
    PIUPARTS_MODE: upgrade
    BACKEND: mysql

##
## Check for forgotten debconf-updatepo.
##
updatepo:
  stage: test
  image: ${SALSA_CI_IMAGES_BASE}
  except:
    - tags

  script:
    - apt-get update
    - apt-get install -y po-debconf git
    - debconf-updatepo
    - git diff debian/po/templates.pot
    - test -z "$(git ls-files -m debian/po/templates.pot)"

##
## Lint the distributed XML files.
##
xmllint:
  stage: test
  image: ${SALSA_CI_IMAGES_BASE}
  except:
    - tags

  script:
    - apt-get update
    - apt-get install -y libxml2-utils
    - apt-get install -y ${WORKING_DIR}/opendnssec-common_*.deb
    - dpkg -L opendnssec-common | grep '\.xml$' | xargs xmllint --noout

##
## Run shellcheck on the packaging scripts.
##
shellcheck:
  stage: test
  image: ${SALSA_CI_IMAGES_BASE}
  except:
    - tags

  script:
    - apt-get update
    - apt-get install -y file shellcheck
    - find debian -type f
          | xargs file
          | awk '-F:' '/shell script/ {print $1}'
          | xargs shellcheck --exclude SC1091,SC2230,SC2034,SC2039
